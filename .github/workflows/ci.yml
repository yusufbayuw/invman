name: InvMan Quality Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd, zip, intl, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate dependencies
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate CI-only encryption key
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Lint application and test PHP
        run: |
          find app database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Vite assets
        run: npm run build
      - name: Run Laravel tests
        run: php artisan test --no-ansi

name: InvMan Quality Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd, zip, intl, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate dependencies
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      # Laravel 12 remediation cleared the previous production PHP advisories.
      # Fail closed if a subsequent lockfile introduces a published advisory.
      - name: Audit production PHP dependencies (required)
        run: composer audit --locked --no-dev --abandoned=ignore --format=table
      - name: Generate CI-only encryption key
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Audit safe production configuration
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: https://invman.test
          SESSION_SECURE_COOKIE: 'true'
          SESSION_HTTP_ONLY: 'true'
          SESSION_SAME_SITE: lax
          TRUSTED_PROXIES: 127.0.0.1,::1
          SEED_DEMO_USERS: 'false'
        run: php artisan invman:security-audit
      - name: Lint application and test PHP
        run: |
          find app database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high
      # Development build tooling still has upstream advisories. Preserve a
      # visible audit without breaking deploy tests while Tailwind v3 is used.
      - name: Audit build-time npm dependencies
        id: npm_build_audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Highlight vulnerable build tooling
        if: ${{ steps.npm_build_audit.outcome == 'failure' }}
        run: |
          echo "::warning::Build-time npm dependencies have unresolved advisories (tracked in issue #21)."
          echo "### ⚠️ npm build dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Build dependencies contain published advisories. Functional CI success does not imply a clean supply-chain audit." >> "$GITHUB_STEP_SUMMARY"
      - name: Build Vite assets
        run: npm run build
      - name: Run Laravel tests
        run: php artisan test --no-ansi

  mysql-migration-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: invman_ci
          MYSQL_USER: invman
          MYSQL_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, mysqli, sodium, gd, zip, intl, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate isolated APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Validate full MySQL schema
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: invman_ci
          DB_USERNAME: invman
          DB_PASSWORD: local-ci-only
        run: php artisan migrate:fresh --force --no-interaction
      - name: Verify role boundaries and restricted-history foreign keys on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: invman_ci
          DB_USERNAME: invman
          DB_PASSWORD: local-ci-only
        run: php artisan test --filter=LoanAccessAndHistoryTest --no-ansi

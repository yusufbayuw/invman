name: One-time Laravel 12 lockfile resolution

on:
  push:
    branches:
      - security/laravel12-compatibility-20261013

permissions:
  contents: write

jobs:
  resolve-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd, zip, intl, fileinfo, bcmath, xml, dom, simplexml
          coverage: none
      - name: Resolve dependency versions in PHP 8.2 and Laravel 12 limits
        run: |
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --no-check-publish
      - name: Audit production Composer lock
        run: composer audit --locked --no-dev --abandoned=ignore --format=table
      - name: Commit solved lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: resolve Laravel 12 dependency graph"
            git push origin HEAD:security/laravel12-compatibility-20261013
          else
            echo "No lockfile updates"
          fi

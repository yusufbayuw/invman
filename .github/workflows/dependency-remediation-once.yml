name: One-time dependency lockfile remediation

on:
  push:
    branches:
      - security/dependency-lockfile-remediation-20261013

permissions:
  contents: write

jobs:
  resolve-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd, zip, intl, fileinfo, bcmath, xml, dom, simplexml
      - name: Resolve latest compatible Composer packages
        # Temporary resolver-only exemption: Laravel 11 releases permitted
        # by this application have published advisories. Do not suppress audits.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: |
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --no-check-publish
      - name: Check remaining Composer advisories
        run: composer audit --locked --no-dev --abandoned=ignore --format=summary || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh npm dependency lock
        run: |
          npm update --no-audit --no-fund
          npm ci
          npm run build
      - name: Review npm vulnerability count
        run: npm audit --audit-level=high || true
      - name: Commit resolved lockfiles only to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): resolve latest compatible secure lockfiles"
            git push origin HEAD:security/dependency-lockfile-remediation-20261013
          else
            echo "No changes to dependency lockfiles"
          fi
